; SpoolBuddy v3 — ESP32-S3 + 4" Touch TFT + PN5180 NFC
; PlatformIO configuration

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3

; No PSRAM on this board
; board_build.arduino.memory_type = qio_opi  ; DO NOT ENABLE

; USB CDC for serial output
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Upload via USB (boot mode required: hold BOOT + press RST)
upload_port = /dev/cu.usbmodem1101
upload_speed = 921600
monitor_speed = 115200

lib_deps =
    ; Display: LovyanGFX (replaces U8g2 for TFT + touch)
    lovyan03/LovyanGFX@^1.1.16
    ; NFC: PN5180 library
    ; (using local/custom — no published lib)
    ; Scale
    bogde/HX711@^0.7.5
    ; JSON for API responses
    bblanchon/ArduinoJson@^7.0.0
    ; RGB LED
    adafruit/Adafruit NeoPixel@^1.12.0
