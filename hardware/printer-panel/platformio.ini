[env:esp32s3]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partition table: 2x OTA + NVS
board_build.partitions = min_spiffs.csv

; USB CDC for serial output on S3 Mini (no separate UART chip)
; NOTE: -isystem paths required because pioarduino 3.x WiFi library includes
;       Network.h via quotes but PlatformIO builds libraries in isolation.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -isystem ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -isystem ${platformio.packages_dir}/framework-arduinoespressif32/libraries/NetworkClientSecure/src

; Deep resolution needed for WiFi→Networking dependency chain
lib_ldf_mode = deep+

; Libraries
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    olikraus/U8g2@^2.35.0

monitor_filters = esp32_exception_decoder
